[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-cooperative-cleaning-marl"
version = "0.1.0"
description = "Safety-constrained cooperative cleaning with independent and shared-policy PPO"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "torch>=2.2,<3", "gymnasium>=1.0,<2", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
safe-cleaning = "safe_cleaning.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

